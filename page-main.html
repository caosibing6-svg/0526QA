<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库文档管理 - LegendAI</title>
<style>
:root {
  --primary: #006eff;
  --primary-light: #e8f2ff;
  --primary-hover: #0056d6;
  --bg: #f5f7fa;
  --surface: #ffffff;
  --border: #e5e8ed;
  --text: #1d2129;
  --text-secondary: #606a7a;
  --text-muted: #a0a7b3;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
  --radius: 8px;
  --radius-lg: 12px;
  --transition: 0.2s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-hover); }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }

/* Top Header */
.top-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  font-size: 13px;
}
.top-header .logo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  margin-right: 8px;
}
.top-header .logo .logo-icon {
  width: 22px;
  height: 22px;
  background: var(--primary);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}
.top-header .divider {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 8px;
}
.top-nav {
  display: flex;
  gap: 2px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.top-nav::-webkit-scrollbar { display: none; }
.top-nav .nav-item {
  padding: 6px 12px;
  border-radius: 6px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-size: 13px;
  transition: var(--transition);
  cursor: pointer;
}
.top-nav .nav-item:hover { background: var(--primary-light); color: var(--primary); }
.top-nav .nav-item.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 500;
}
.top-nav .nav-item .badge-new {
  display: inline-block;
  background: #00b365;
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  vertical-align: middle;
}
.top-header .header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.btn-deploy {
  background: var(--primary);
  color: #fff;
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 12px;
  white-space: nowrap;
}
.btn-deploy:hover { background: var(--primary-hover); }
.workspace-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
}
.workspace-selector:hover { background: var(--bg); }
.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* Sub Header */
.sub-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.back-link {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
}
.back-link:hover { color: var(--primary); }
.kb-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.kb-title .edit-icon {
  margin-left: 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
}
.kb-title .edit-icon:hover { color: var(--primary); }
.sub-tabs {
  display: flex;
  gap: 0;
  margin-left: 8px;
}
.sub-tab {
  padding: 12px 16px;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
}
.sub-tab:hover { color: var(--primary); }
.sub-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 500;
}
.sub-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  font-size: 12px;
  color: var(--text-secondary);
}
.sub-header-right .info-item {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.sub-header-right .info-item:hover { color: var(--primary); }
.more-btn {
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-secondary);
  background: none;
  font-size: 14px;
}
.more-btn:hover { background: var(--bg); }

/* Main Layout */
.main-layout {
  display: flex;
  height: calc(100vh - 96px);
}
.sidebar {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 16px 16px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-header .collapse-btn {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: none;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.sidebar-header .collapse-btn:hover { background: var(--bg); }
.sidebar-search {
  margin: 0 12px 12px;
  position: relative;
}
.sidebar-search input {
  width: 100%;
  padding: 6px 10px 6px 30px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
  color: var(--text);
  background: var(--bg);
}
.sidebar-search input:focus { border-color: var(--primary); }
.sidebar-search .search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
}
.cat-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px;
}
.cat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: var(--transition);
}
.cat-item:hover { background: var(--bg); }
.cat-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
.cat-item .count {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg);
  padding: 1px 6px;
  border-radius: 8px;
}
.cat-item.active .count { background: rgba(0,110,255,0.1); color: var(--primary); }
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.toolbar {
  background: var(--surface);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.btn-import {
  background: var(--primary);
  color: #fff;
  padding: 7px 18px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.btn-import:hover { background: var(--primary-hover); }
.btn-batch {
  background: var(--surface);
  color: var(--text-secondary);
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 4px;
}
.btn-batch:hover { border-color: var(--primary); color: var(--primary); }
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-select {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--surface);
  outline: none;
  cursor: pointer;
  min-width: 100px;
}
.filter-select:hover { border-color: var(--primary); }
.filter-select:focus { border-color: var(--primary); }
.search-input {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
  width: 160px;
  color: var(--text);
}
.search-input:focus { border-color: var(--primary); }
.search-input::placeholder { color: var(--text-muted); }
.filter-date {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
  color: var(--text-secondary);
  cursor: pointer;
}
.filter-date:hover { border-color: var(--primary); }
.refresh-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
}
.refresh-btn:hover { border-color: var(--primary); color: var(--primary); }
.content-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  background: var(--primary-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty-icon svg { width: 36px; height: 36px; color: var(--primary); }
.empty-title {
  font-size: 16px;
  color: var(--text);
  margin-bottom: 8px;
  font-weight: 500;
}
.empty-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
}
.empty-btn {
  background: var(--primary);
  color: #fff;
  padding: 8px 24px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
}
.empty-btn:hover { background: var(--primary-hover); }

/* Responsive */
@media (max-width: 1200px) {
  .top-nav .nav-item { padding: 6px 8px; font-size: 12px; }
  .filter-group { flex-wrap: wrap; }
  .search-input { width: 120px; }
}
</style>
</head>
<body>

<!-- Top Header -->
<header class="top-header">
  <div class="logo">
    <div class="logo-icon">云</div>
    <span>腾讯云</span>
  </div>
  <span class="divider"></span>
  <span style="font-size:13px;color:var(--text-secondary);white-space:nowrap;">|&nbsp;智能体开发平台</span>
  <nav class="top-nav">
    <span class="nav-item">应用开发</span>
    <span class="nav-item">智能工作台<span class="badge-new">NEW</span></span>
    <span class="nav-item">ClawPro</span>
    <span class="nav-item active">知识库</span>
    <span class="nav-item">Widget</span>
    <span class="nav-item">连接器与工具</span>
    <span class="nav-item">Skills广场</span>
    <span class="nav-item">模型广场</span>
    <span class="nav-item">提示词模板</span>
    <span class="nav-item">应用模板</span>
    <span class="nav-item">原子能力</span>
    <span class="nav-item">平台管理</span>
    <span class="nav-item" style="color:var(--text-muted);">收起</span>
  </nav>
  <div class="header-right">
    <button class="btn-deploy">一键部署 ClawPro</button>
    <div class="workspace-selector">
      <span>🏢</span>
      <span>默认工作空间</span>
      <span>▾</span>
    </div>
    <div class="user-avatar">王</div>
  </div>
</header>

<!-- Sub Header -->
<div class="sub-header">
  <span class="back-link" onclick="history.back()">← 返回</span>
  <span class="kb-title">前海e站 <span class="edit-icon">✎</span></span>
  <div class="sub-tabs">
    <span class="sub-tab active">文档</span>
    <span class="sub-tab">问答</span>
    <span class="sub-tab">数据库</span>
  </div>
  <div class="sub-header-right">
    <span class="info-item">📊 知识库字符用量</span>
    <span class="info-item">🕸 知识图谱</span>
    <button class="more-btn">⋯</button>
  </div>
</div>

<!-- Main Layout -->
<div class="main-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>分类</span>
      <button class="collapse-btn" onclick="toggleSidebar()">◀</button>
    </div>
    <div class="sidebar-search">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="搜索分类...">
    </div>
    <div class="cat-list">
      <div class="cat-item active">
        <span>📁</span>
        <span>全部分类</span>
        <span class="count">0</span>
      </div>
      <div class="cat-item">
        <span>📁</span>
        <span>未分类</span>
        <span class="count">0</span>
      </div>
    </div>
  </aside>

  <!-- Content -->
  <div class="content-area">
    <div class="toolbar">
      <button class="btn-import" onclick="openImportDialog()">📥 导入</button>
      <button class="btn-batch">📋 批量操作</button>
      <div class="filter-group">
        <select class="filter-select">
          <option>文档</option>
          <option>网页</option>
          <option>表格</option>
        </select>
        <input type="text" class="search-input" placeholder="关键词搜索">
        <select class="filter-select">
          <option>文档状态</option>
          <option>处理中</option>
          <option>已完成</option>
          <option>失败</option>
        </select>
        <select class="filter-select">
          <option>全部范围生效</option>
          <option>已生效</option>
          <option>未生效</option>
        </select>
        <input type="date" class="filter-date" placeholder="更新时间">
        <button class="refresh-btn">↻</button>
      </div>
    </div>
    <div class="content-body">
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
        </div>
        <div class="empty-title">导入文档，丰富知识来源</div>
        <div class="empty-desc">支持PDF、Word、Excel、txt、HTML、Markdown等格式文档导入</div>
        <button class="empty-btn" onclick="openImportDialog()">📥 导入文档</button>
      </div>
    </div>
  </div>
</div>

<script>
function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
}

function openImportDialog() {
  // Open import dialog in a new page
  window.open('page-import-step1.html', '_blank');
}

// Tab switching
document.querySelectorAll('.sub-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
  });
});

// Category switching
document.querySelectorAll('.cat-item').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>

</body>
</html>

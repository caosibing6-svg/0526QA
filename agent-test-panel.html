<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体测试 | LegendAI</title>
<style>
:root {
  --primary: #4F6EF7;
  --primary-light: #EEF1FF;
  --primary-hover: #3a56e0;
  --primary-ghost: #f5f6ff;
  --bg: #f0f2f8;
  --surface: #ffffff;
  --sidebar-bg: #ffffff;
  --border: #e8eaf0;
  --border-light: #f1f2f6;
  --text: #1a1d2e;
  --text-secondary: #5a6080;
  --text-muted: #9ba3c0;
  --shadow: 0 1px 4px rgba(79,110,247,0.06);
  --shadow-md: 0 4px 16px rgba(79,110,247,0.10);
  --radius: 8px;
  --radius-lg: 12px;
  --transition: 0.18s ease;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== Titlebar ===== */
.titlebar {
  height: 28px;
  background: #2c3050;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  flex-shrink: 0;
}

/* ===== App Layout ===== */
.app-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ===== Global Sidebar ===== */
.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-logo {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.logo-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--primary-light);
  border: 2px solid var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 700;
  font-size: 16px;
}
.logo-text { font-size: 15px; font-weight: 600; color: var(--text); }
.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.nav-section-title {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 6px 14px 4px; margin-top: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 14px;
  border-radius: 7px; color: var(--text-secondary); cursor: pointer;
  transition: var(--transition); text-decoration: none; font-size: 13.5px; position: relative;
}
.nav-item:hover { background: var(--primary-ghost); color: var(--primary); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--primary);
}
.nav-separator { height: 1px; background: var(--border); margin: 8px 14px; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ===== Main Content ===== */
.main-content {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== Page Header ===== */
.page-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  flex-shrink: 0;
}
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-muted); margin-bottom: 10px; flex-wrap: wrap;
}
.breadcrumb a { color: var(--text-muted); text-decoration: none; transition: var(--transition); }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb .sep { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
.breadcrumb .current { color: var(--primary); font-weight: 600; pointer-events: none; }
.page-title-row { display: flex; align-items: center; justify-content: space-between; }
.page-title-row h2 { font-size: 18px; font-weight: 700; color: var(--text); }
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
}
.status-badge.online { background: #ecfdf5; color: #059669; }
.status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ===== Split Panel Layout ===== */
.split-panel {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ===== Left Panel: 智能体选择 ===== */
.left-panel {
  width: 380px;
  min-width: 320px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

.left-panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}

.left-panel-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.left-panel-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.search-agent-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  margin-top: 12px;
  transition: var(--transition);
}

.search-agent-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(79,110,247,0.08);
}

.search-agent-box svg { width: 15px; height: 15px; color: var(--text-muted); flex-shrink: 0; }

.search-agent-box input {
  border: none; outline: none; font-size: 13px; color: var(--text);
  width: 100%; background: transparent;
}
.search-agent-box input::placeholder { color: var(--text-muted); }

/* 筛选标签 */
.filter-tags {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.filter-tag {
  padding: 4px 10px;
  font-size: 11.5px;
  border-radius: 12px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
  background: var(--surface);
}

.filter-tag:hover { border-color: var(--primary); color: var(--primary); }

.filter-tag.active {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}

/* 智能体卡片列表 */
.agent-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px 16px;
}

.agent-card {
  background: var(--surface);
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}

.agent-card:hover {
  border-color: var(--primary);
  box-shadow: 0 2px 12px rgba(79,110,247,0.08);
  transform: translateY(-1px);
}

.agent-card.selected {
  border-color: var(--primary);
  background: var(--primary-ghost);
  box-shadow: 0 2px 12px rgba(79,110,247,0.12);
}

.agent-card.selected::before {
  content: '';
  position: absolute;
  left: -1px;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--primary);
}

.agent-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 8px;
}

.agent-avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  margin-right: 12px;
}

.agent-avatar.purple { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
.agent-avatar.blue   { background: linear-gradient(135deg, #4F6EF7, #818cf8); }
.agent-avatar.green  { background: linear-gradient(135deg, #059669, #34d399); }
.agent-avatar.orange { background: linear-gradient(135deg, #ea580c, #fb923c); }
.agent-avatar.pink   { background: linear-gradient(135deg, #db2777, #f472b6); }
.agent-avatar.teal   { background: linear-gradient(135deg, #0d9488, #2dd4bf); }

.agent-card-top {
  display: flex;
  align-items: flex-start;
  flex: 1;
}

.agent-info {
  flex: 1;
}

.agent-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
  line-height: 1.3;
}

.agent-version {
  font-size: 11px;
  color: var(--text-muted);
  padding: 1px 6px;
  background: var(--bg);
  border-radius: 4px;
  margin-left: 6px;
}

.agent-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
  margin-bottom: 4px;
}

/* 状态 & 元信息 */
.agent-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.agent-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
}

.agent-meta-item svg { width: 12px; height: 12px; }

.agent-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

.agent-status.ready  { background: #ecfdf5; color: #059669; }
.agent-status.draft  { background: #fffbeb; color: #d97706; }
.agent-status.offline { background: #fef2f2; color: #dc2626; }

.stat-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}

/* 选择状态标签 */
.selected-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--primary);
  display: none;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
}
.agent-card.selected .selected-badge { display: flex; }
.agent-card.selected .agent-card-actions .btn-test { display: none; }

.agent-card-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

.btn-test {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--primary);
  background: var(--surface);
  color: var(--primary);
  transition: var(--transition);
}

.btn-test:hover {
  background: var(--primary);
  color: #fff;
}

.btn-test.pinned {
  background: var(--primary);
  color: #fff;
}

.btn-test svg { width: 14px; height: 14px; }

/* ===== Right Panel: 对话测试区 ===== */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

/* 测试区顶部信息 */
.test-header {
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.test-agent-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.test-agent-info .agent-avatar {
  width: 32px; height: 32px;
  border-radius: 8px;
  font-size: 14px;
  margin-right: 0;
}

.test-agent-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}

.test-agent-ver {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 6px;
  padding: 1px 6px;
  background: var(--bg);
  border-radius: 4px;
}

.test-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); }
.btn-icon svg { width: 16px; height: 16px; }

/* 对话区域 */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 欢迎提示 */
.chat-welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.chat-welcome-icon {
  width: 64px; height: 64px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 16px;
}

.chat-welcome h3 {
  font-size: 16px;
  color: var(--text);
  margin-bottom: 8px;
}

.chat-welcome p {
  font-size: 13px;
  max-width: 400px;
  line-height: 1.6;
}

/* 快捷问题标签 */
.quick-questions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  justify-content: center;
}

.quick-q {
  padding: 8px 16px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.quick-q:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-ghost);
}

/* 聊天消息 */
.chat-message {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.chat-message.agent {
  align-self: flex-start;
}

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.msg-avatar.user { background: var(--primary); }
.msg-avatar.agent-avatar-color { background: linear-gradient(135deg, #7c3aed, #a78bfa); }

.msg-bubble {
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13.5px;
  line-height: 1.6;
  word-break: break-word;
}

.msg-bubble.user-bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg-bubble.agent-bubble {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-light);
  border-bottom-left-radius: 4px;
}

.msg-time {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
}

.chat-message.user .msg-time { text-align: right; }

/* 输入区域 */
.chat-input-area {
  padding: 16px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}

.chat-input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  transition: var(--transition);
}

.chat-input-wrapper:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(79,110,247,0.08);
}

.chat-input-wrapper textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  font-size: 13.5px;
  color: var(--text);
  font-family: inherit;
  line-height: 1.5;
  background: transparent;
  max-height: 120px;
  min-height: 24px;
}

.chat-input-wrapper textarea::placeholder { color: var(--text-muted); }

.btn-send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 8px;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}

.btn-send:hover { background: var(--primary-hover); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-send svg { width: 18px; height: 18px; }

/* 空状态 */
.no-agent-hint {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  padding: 40px;
  text-align: center;
}

.no-agent-hint svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.3; }
.no-agent-hint h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
.no-agent-hint p { font-size: 13px; max-width: 300px; line-height: 1.5; }

/* 分割线标签 */
.divider-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0 12px;
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.divider-label::before,
.divider-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-light);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  padding: 10px 20px;
  border-radius: 8px;
  background: #1a1d2e;
  color: #fff;
  font-size: 13px;
  z-index: 999;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Responsive */
@media (max-width: 1024px) {
  .left-panel { width: 300px; min-width: 260px; }
  .sidebar { width: 60px; }
  .sidebar .logo-text,
  .sidebar .nav-item span,
  .sidebar .nav-section-title { display: none; }
  .sidebar .nav-item { justify-content: center; padding: 9px; }
}
</style>
</head>

</div>

<div class="app-layout">

      </div>
      <div class="nav-item" onclick="toast('知识库')">

        <span>知识库</span>
      </div>
      <div class="nav-item active" onclick="toast('对话测试')">

        <span>对话测试</span>
      </div>
      <div class="nav-separator"></div>

// ===== 渲染智能体列表 =====
function renderAgentList(filterText = '') {
  const container = document.getElementById('agentList');
  const filtered = agents.filter(a => {
    const matchFilter = currentFilter === 'all' || a.status === currentFilter;
    const matchSearch = !filterText || a.name.toLowerCase().includes(filterText.toLowerCase()) || a.desc.toLowerCase().includes(filterText.toLowerCase());
    return matchFilter && matchSearch;
  });

  const readyList = filtered.filter(a => a.status === 'ready');
  const otherList = filtered.filter(a => a.status !== 'ready');

  let html = '';

  if (readyList.length > 0) {
    html += renderAgentGroup(readyList, '已发布智能体');
  }
  if (otherList.length > 0) {
    html += renderAgentGroup(otherList, '未发布 / 已下线');
  }

  if (filtered.length === 0) {
    html = '<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px;">未找到匹配的智能体</div>';
  }

  container.innerHTML = html;

  // 重新绑定卡片点击
  container.querySelectorAll('.agent-card').forEach(card => {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.btn-test')) return; // 不拦截按钮点击
      const id = this.dataset.agentId;
      selectAgent(id);
    });
  });
}

function renderAgentGroup(agents, label) {
  let html = '<div class="divider-label">' + label + '</div>';
  agents.forEach(a => {
    const sel = a.id === currentAgentId ? ' selected' : '';
    html += `
    <div class="agent-card${sel}" data-agent-id="${a.id}">
      <div class="selected-badge">✓</div>
      <div class="agent-card-top">
        <div class="agent-avatar ${a.avatarClass}">${a.avatarChar}</div>
        <div class="agent-info">
          <div>
            <span class="agent-name">${a.name}</span>
            <span class="agent-version">${a.version}</span>
          </div>
          <p class="agent-desc">${a.desc}</p>
          <div class="agent-meta">
            <span class="agent-status ${a.status}"><span class="stat-dot"></span>${a.statusText}</span>
            <span class="agent-meta-item">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.5v3l2 1.5"/></svg>

  });
  return html;
}

// ===== 选择智能体 =====
function selectAgent(agentId) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;

  currentAgentId = agentId;
  renderAgentList(document.getElementById('agentSearch').value);

  // 显示右侧头部
  document.getElementById('testHeaderEmpty').style.display = 'none';
  document.getElementById('testHeaderActive').style.display = 'flex';
  document.getElementById('testActions').style.display = 'flex';

  // 更新头像
  const av = document.getElementById('testAvatarC');

  av.textContent = agent.avatarChar;

  document.getElementById('testAgentName').textContent = agent.name;
  document.getElementById('testAgentVer').textContent = agent.version;

  // 显示欢迎界面
  showWelcome(agent);

  // 启用发送按钮
  document.getElementById('btnSend').disabled = false;

function showWelcome(agent) {
  const chatArea = document.getElementById('chatArea');
  chatArea.querySelectorAll('.chat-message').forEach(m => m.remove());
  chatHistory = [];

  const welcome = document.getElementById('chatWelcome');
  const agentWelcome = document.getElementById('chatAgentWelcome');

  if (agent && currentAgentId) {
    welcome.style.display = 'none';
    agentWelcome.style.display = 'flex';

    const fullAgent = agents.find(a => a.id === currentAgentId);
    document.getElementById('chatWelcomeIcon').style.background = fullAgent.gradient;
    document.getElementById('chatWelcomeIcon').textContent = fullAgent.icon;
    document.getElementById('welcomeTitle').textContent = '你好，我是 ' + fullAgent.name;
    document.getElementById('welcomeDesc').textContent = fullAgent.desc + '，请提出你的问题进行测试。';

    qqs.innerHTML = fullAgent.quickQuestions.map(q =>
      `<span class="quick-q" onclick="sendQuickQuestion('${q.replace(/'/g, "\\'")}')">${q}</span>`
    ).join('');
  } else {
    welcome.style.display = 'flex';
    agentWelcome.style.display = 'none';
  }
}

  const input = document.getElementById('chatInput');
  input.value = text;
  sendMessage();

// ===== 发送消息 =====
function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentAgentId) return;

  // 隐藏欢迎界面
  document.getElementById('chatWelcome').style.display = 'none';
  document.getElementById('chatAgentWelcome').style.display = 'none';

  // 用户消息
  addMessage('user', text);

  input.value = '';
  input.style.height = 'auto';

  // 模拟智能体回复
  setTimeout(() => {
    const agent = agents.find(a => a.id === currentAgentId);
    const reply = generateReply(text, agent);
    addMessage('agent', reply, agent);
  }, 800 + Math.random() * 1200);
}

function addMessage(type, text, agent) {
  const chatArea = document.getElementById('chatArea');
  const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  const msgEl = document.createElement('div');
  msgEl.className = 'chat-message ' + type;

  const agentData = agents.find(a => a.id === currentAgentId);
  const avatarClass = agentData ? agentData.avatarClass : 'purple';
  const avatarChar = agentData ? agentData.avatarChar : 'AI';
  const gradient = agentData ? agentData.gradient : 'linear-gradient(135deg,#7c3aed,#a78bfa)';

  msgEl.innerHTML = type === 'user'
    ? `
      <div class="msg-avatar user">我</div>
      <div>
        <div class="msg-bubble user-bubble">${escapeHtml(text)}</div>
        <div class="msg-time">${time}</div>
      </div>`
    : `
      <div class="msg-avatar agent-avatar-color" style="background:${gradient};">${avatarChar}</div>
      <div>
        <div class="msg-bubble agent-bubble">${escapeHtml(text)}</div>
        <div class="msg-time">${time}</div>
      </div>`;

  chatArea.appendChild(msgEl);
  chatHistory.push({ type, text, time });
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

      '关于知识产权保护，近期国务院发布了《知识产权强国建设纲要（2021-2035年）》实施方案，涵盖专利权、商标权、著作权等方面的保护措施。企业在侵权诉讼中可申请诉前禁令和证据保全，建议及时注册商标和专利以保护自身权益。'
    ]
  };

  const agentReplies = replies[agent.id] || [
    '感谢您的提问，我正在查询相关信息。',
    '我已收到您的问题，正在为您整理答复。',
    '这是一个很好的问题，让我来为您解答。',
    '请稍等，我正在检索最新的信息为您提供准确的回答。'
  ];

  return agentReplies[Math.floor(Math.random() * agentReplies.length)];
}

// ===== 输入框处理 =====
function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ===== 清空对话 =====
function clearChat() {
  if (!currentAgentId) return;
  chatHistory = [];
  const agent = agents.find(a => a.id === currentAgentId);
  showWelcome(agent);
  toast('对话已清空');
}

// ===== 筛选 =====
function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('#filterTags .filter-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAgentList(document.getElementById('agentSearch').value);
}

function filterAgents() {
  renderAgentList(document.getElementById('agentSearch').value);
}

// ===== Toast =====
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===== 键盘快捷键 =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && currentAgentId) {
    currentAgentId = null;
    renderAgentList();
    document.getElementById('testHeaderEmpty').style.display = 'flex';
    document.getElementById('testHeaderActive').style.display = 'none';
    document.getElementById('testActions').style.display = 'none';
    document.getElementById('chatWelcome').style.display = 'flex';
    document.getElementById('chatAgentWelcome').style.display = 'none';
    document.getElementById('chatArea').querySelectorAll('.chat-message').forEach(m => m.remove());
    document.getElementById('btnSend').disabled = true;
    toast('已取消当前选择');
  }
});

// ===== 初始化 =====
renderAgentList();
</script>

</body>
</html>
